<rect x="16" y="50" width="6" height="2" fill="#D2E2F0" />
  </g>

  <!-- Collectibles (Floating) -->
  <!-- Amber -->
  <g style="animation: gemBob1 2.4s ease-in-out infinite;" transform="translate(290, 175)">
    <circle cx="0" cy="0" r="14" fill="#FFCC00" opacity="0.25" />
    <polygon points="0,-10 8,0 0,10 -8,0" fill="#FFCC00" />
    <polygon points="0,-6 5,0 0,6 -5,0" fill="#FFEE66" />
    <circle cx="-1" cy="-1" r="2" fill="#FFFFFF" />
  </g>

  <!-- Tech Scrap -->
  <g style="animation: gemBob2 2.4s ease-in-out infinite;" transform="translate(520, 168)">
    <circle cx="0" cy="0" r="14" fill="#00EED8" opacity="0.25" />
    <rect x="-8" y="-8" width="16" height="16" fill="#00BBAA" />
    <rect x="-6" y="-6" width="12" height="12" fill="#00FFEE" />
    <rect x="-2" y="-2" width="4" height="4" fill="#FFFFFF" />
  </g>

  <!-- Dino DNA -->
  <g style="animation: gemBob1 2.4s ease-in-out infinite;" transform="translate(635, 162)">
    <circle cx="0" cy="0" r="14" fill="#FF44CC" opacity="0.25" />
    <path d="M-6,-8 C0,-4 0,4 6,8 M6,-8 C0,-4 0,4 -6,8" stroke="#FF44CC" stroke-width="3" fill="none" />
    <circle cx="-6" cy="-8" r="2.5" fill="#FF88DD" />
    <circle cx="6" cy="8" r="2.5" fill="#FF88DD" />
    <circle cx="6" cy="-8" r="2.5" fill="#FFFFFF" />
    <circle cx="-6" cy="8" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Extraction Portal -->
  <g transform="translate(790, 165)">
    <!-- Aura -->
    <ellipse cx="0" cy="0" rx="42" ry="68" fill="url(#portalGlow)" style="animation: portalPulse 2.4s ease-in-out infinite;" />
    <!-- Rotating rings -->
    <g style="animation: portalSpin 6s linear infinite;">
      <ellipse cx="0" cy="0" rx="36" ry="58" fill="none" stroke="#00EED8" stroke-width="3" stroke-dasharray="16 8" />
      <ellipse cx="0" cy="0" rx="26" ry="42" fill="none" stroke="#66FFEE" stroke-width="3" stroke-dasharray="12 6" />
      <ellipse cx="0" cy="0" rx="16" ry="26" fill="none" stroke="#CCFFFF" stroke-width="2" stroke-dasharray="8 4" />
    </g>
    <!-- Singularity core -->
