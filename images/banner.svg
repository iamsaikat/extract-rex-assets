<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <style>
      @keyframes dinoRun {
        0%, 49.9% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes dinoRunAlt {
        0%, 49.9% { opacity: 0; }
        50%, 100% { opacity: 1; }
      }
      @keyframes pteroFlap {
        0%, 49.9% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pteroFlapAlt {
        0%, 49.9% { opacity: 0; }
        50%, 100% { opacity: 1; }
      }
      @keyframes groundScroll {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-180px); }
      }
      @keyframes cloudDrift1 {
        0% { transform: translateX(0px); }
        100% { transform: translateX(900px); }
      }
      @keyframes cloudDrift2 {
        0% { transform: translateX(0px); }
        100% { transform: translateX(900px); }
      }
      @keyframes portalPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes portalSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes gemBob1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes gemBob2 {
        0%, 100% { transform: translateY(-6px); }
        50% { transform: translateY(3px); }
      }
      @keyframes ufoHover {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.2; }
      }
      .pixel-font {
        font-family: 'Courier New', Courier, monospace;
        font-weight: 900;
        letter-spacing: 1px;
      }
    </style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0E16" />
      <stop offset="60%" stop-color="#141824" />
      <stop offset="100%" stop-color="#1A2032" />
    </linearGradient>

    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#CCFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00EED8" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#008899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#005566" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00EED8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00EED8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.08" stroke="#00EED8" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="100" y1="0" x2="100" y2="235" />
    <line x1="200" y1="0" x2="200" y2="235" />
    <line x1="300" y1="0" x2="300" y2="235" />
    <line x1="400" y1="0" x2="400" y2="235" />
    <line x1="500" y1="0" x2="500" y2="235" />
    <line x1="600" y1="0" x2="600" y2="235" />
    <line x1="700" y1="0" x2="700" y2="235" />
    <line x1="800" y1="0" x2="800" y2="235" />
  </g>

  <!-- Clouds -->
  <g opacity="0.4">
    <g style="animation: cloudDrift1 40s linear infinite;">
      <path d="M 50,65 h 30 v 4 h -4 v 4 h -22 v -4 h -4 z" fill="#5A6E8C" />
      <path d="M 550,85 h 45 v 5 h -6 v 5 h -33 v -5 h -6 z" fill="#5A6E8C" />
    </g>
  </g>

  <!-- UFO Mothership -->
  <g style="animation: ufoHover 2.4s ease-in-out infinite;" transform="translate(600, 45)">
    <polygon points="28,20 0,68 56,68" fill="url(#beamGrad)" />
    <!-- Dome -->
    <rect x="20" y="2" width="16" height="7" fill="#A0B4C0" opacity="0.9" />
    <rect x="24" y="4" width="8" height="4" fill="#5AB464" />
    <!-- Hull -->
    <rect x="10" y="9" width="36" height="4" fill="#B4BEC8" />
    <rect x="0" y="12" width="56" height="5" fill="#646E78" />
    <rect x="6" y="17" width="44" height="3" fill="#32373C" />
    <!-- Lights -->
    <circle cx="8" cy="14" r="1.5" fill="#00FFEE" />
    <circle cx="18" cy="14" r="1.5" fill="#FF44CC" />
    <circle cx="28" cy="14" r="1.5" fill="#00FFEE" />
    <circle cx="38" cy="14" r="1.5" fill="#FF44CC" />
    <circle cx="48" cy="14" r="1.5" fill="#00FFEE" />
